name: tissot-BakaSU-SUSFS

on:
  push:
    branches: [BakaSU-susfs]
  workflow_dispatch:

permissions:
  contents: write # softprops/action-gh-release publishes the release

concurrency:
  group: ${{ github. workflow }}-${{ github. ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      sha8: ${{ steps.meta.outputs.sha8 }}
      ksu_sha: ${{ steps.meta.outputs.ksu_sha }}
      ksu_count: ${{ steps.meta.outputs.ksu_count }}
      bakasu_ver: ${{ steps.meta.outputs.bakasu_ver }}
      bakasu_ver_code: ${{ steps.meta.outputs.bakasu_ver_code }}
      bakasu_ver_name: ${{ steps.meta.outputs.bakasu_ver_name }}
      bakasu_managers: ${{ steps.meta.outputs.bakasu_managers }}
      kver: ${{ steps.meta.outputs.kver }}
      kernel_string: ${{ steps.meta.outputs.kernel_string }}
      build_ts: ${{ steps.meta.outputs.build_ts }}
      image: ${{ steps.img.outputs.image }}
      zip: ${{ steps.pkg.outputs.zip }}
    steps:
      - name: "Checkout with submodules"
        uses: actions/checkout@v4
        with:
          submodules: recursive # pulls KernelSU (BakaSU) + anykernel after the merge
          fetch-depth: 0 # full history: needed for the KernelSU commit count in the version string

      - name: Build metadata
        id: meta
        run: |
          set -eo pipefail
          SHA8="$(git rev-parse --short=8 HEAD)"
          BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
          BUILD_DATE="$(date -u +%Y%m%d)"
          # BakaSU lives in the KernelSU submodule (merged by the kernel agent) - tolerate its absence
          KSU_SHA="unknown"
          KSU_COUNT="0"
          KSU_DESCRIBE="unknown"
          BAKASU_VER_CODE="unknown"
          BAKASU_VER_NAME="unknown"
          BAKASU_MANAGERS="unknown"
          if [ -d drivers/KernelSU ] && [ -n "$(ls -A drivers/KernelSU 2>/dev/null)" ]; then
            KSU_SHA="$(git -C drivers/KernelSU rev-parse --short=8 HEAD 2>/dev/null || echo unknown)"
            KSU_COUNT="$(git -C drivers/KernelSU rev-list --count HEAD 2>/dev/null || echo 0)"
            KSU_TAG="$(git -C drivers/KernelSU describe --abbrev=0 --tags 2>/dev/null || echo unknown)"
            KSU_DESCRIBE="$(git -C drivers/KernelSU describe --tags --always 2>/dev/null || echo unknown)"
            KSU_BRANCH="$(git -C drivers/KernelSU branch --show-current 2>/dev/null || true)"
            if [ -z "$KSU_BRANCH" ]; then KSU_BRANCH="unknown"; fi
            KBUILD="drivers/KernelSU/kernel/Kbuild"
            KCFG="drivers/KernelSU/kernel/Kconfig"
            # --- primary source: kernel/Kbuild, i.e. the exact math the KSU module prints at build time ---
            # KSU_VERSION := $(shell expr <const> + $(rev-list --count HEAD) [+ <const> ...])
            if [ -f "$KBUILD" ]; then
              CODE_EXPR="$(sed -n 's/^KSU_VERSION := \$(shell expr \(.*\)).*$/\1/p' "$KBUILD" | head -n1)"
              if [ -n "$CODE_EXPR" ]; then
                CONST_SUM="$(printf '%s\n' "$CODE_EXPR" | grep -o '[0-9][0-9]*' | awk '{s+=$1} END{print s+0}')"
                BAKASU_VER_CODE="$(( CONST_SUM + KSU_COUNT ))"
              fi
              # KSU_VERSION_FULL := CONFIG_KSU_FULL_NAME_FORMAT with the %PLACEHOLDER%s resolved
              # (sed range, not awk: mawk on the ubuntu runner rejects [[:space:]])
              NAME_FMT="$(sed -n '/^config KSU_FULL_NAME_FORMAT$/,/^[^[:space:]]/ s/^[[:space:]]*default "\(.*\)".*/\1/p' "$KCFG" | head -n1)"
              if [ -n "$NAME_FMT" ]; then
                BAKASU_VER_NAME="$NAME_FMT"
                BAKASU_VER_NAME="${BAKASU_VER_NAME//%TAG_NAME%/$KSU_TAG}"
                BAKASU_VER_NAME="${BAKASU_VER_NAME//%COMMIT_SHA%/$KSU_SHA}"
                BAKASU_VER_NAME="${BAKASU_VER_NAME//%REPO_NAME%/BakaSU}"
                BAKASU_VER_NAME="${BAKASU_VER_NAME//%BRANCH_NAME%/$KSU_BRANCH}"
                BAKASU_VER_NAME="${BAKASU_VER_NAME//%KSU_VERSION%/$BAKASU_VER_CODE}"
              fi
              # 'Supported Managers' line - only emitted when CONFIG_KSU_MULTI_MANAGER_SUPPORT=y
              MGR="$(sed -n 's/^\$(info -- Supported Managers: \(.*\))$/\1/p' "$KBUILD" | head -n1)"
              MGR="$(printf '%s' "$MGR" | sed 's/[[:space:]]*$//')"
              if [ -n "$MGR" ]; then BAKASU_MANAGERS="$MGR"; fi
            fi
            # --- fallback: submodule git only, no hardcoded version numbers ---
            if [ -f "$KBUILD" ] && [ -z "$NAME_FMT" ]; then
              echo ":: warning::KSU_FULL_NAME_FORMAT not found in kernel/Kconfig - falling back to git describe"
            fi
            if [ "$BAKASU_VER_NAME" = "unknown" ] && [ "$KSU_DESCRIBE" != "unknown" ]; then
              BAKASU_VER_NAME="$KSU_DESCRIBE"
            fi
            if [ "$BAKASU_VER_CODE" = "unknown" ]; then
              echo ":: warning::BakaSU version code not derivable from kernel/Kbuild - release shows 'unknown'"
            fi
            if [ "$BAKASU_MANAGERS" = "unknown" ] && grep -qE '^CONFIG_KSU_MULTI_MANAGER_SUPPORT=y' arch/arm64/configs/tissot_defconfig 2>/dev/null; then
              echo ":: warning::CONFIG_KSU_MULTI_MANAGER_SUPPORT=y but no 'Supported Managers' line in kernel/Kbuild"
            fi
          fi
          # composite version string for kernel.string + the release table
          if [ "$BAKASU_VER_NAME" != "unknown" ] && [ "$BAKASU_VER_CODE" != "unknown" ]; then
            BAKASU_VER="$BAKASU_VER_NAME (code $BAKASU_VER_CODE)"
          elif [ "$BAKASU_VER_NAME" != "unknown" ]; then
            BAKASU_VER="$BAKASU_VER_NAME"
          elif [ "$KSU_COUNT" != "0" ]; then
            BAKASU_VER="r${KSU_COUNT}"
          else
            BAKASU_VER="unknown"
          fi
          KVER="$(sed -n 's/^VERSION = //p' Makefile).$(sed -n 's/^PATCHLEVEL = //p' Makefile).$(sed -n 's/^SUBLEVEL = //p' Makefile)"
          KERNEL_STRING="tissot-${KVER}|BakaSU-SUSFS|${BAKASU_VER}|g${SHA8}"
          {
            echo "sha8=$SHA8"
            echo "ksu_sha=$KSU_SHA"
            echo "ksu_count=$KSU_COUNT"
            echo "bakasu_ver=$BAKASU_VER"
            echo "bakasu_ver_code=$BAKASU_VER_CODE"
            echo "bakasu_ver_name=$BAKASU_VER_NAME"
            echo "bakasu_managers=$BAKASU_MANAGERS"
            echo "kver=$KVER"
            echo "kernel_string=$KERNEL_STRING"
            echo "build_ts=$BUILD_TS"
            echo "build_date=$BUILD_DATE"
          } >> "$GITHUB_OUTPUT"
          echo "kernel.string=$KERNEL_STRING"
          # BakaSU build-log format - re-derived on every BakaSU sync, never hardcoded
          echo "${BUILD_TS} -- BakaSU version code: $BAKASU_VER_CODE"
          echo "${BUILD_TS} -- BakaSU version name: $BAKASU_VER_NAME"
          echo "${BUILD_TS} -- Supported Managers: $BAKASU_MANAGERS"
          # Kernel feature set actually compiled in, read from the settled config
          # so the log can never claim a feature the build does not have.
          FEATURES=""
          for f in SCHED_BORE:BORE LRU_GEN:MGLRU NTSYNC:NTSYNC \
                   IOSCHED_ADIOS:ADIOS TCP_CONG_BBR3:BBRv3 NOMOUNT:NoMount \
                   BBG:Baseband-guard REKERNEL:Rekernel \
                   SCHED_POC_SELECTOR:POC-selector CPU_FREQ_GOV_REFLEX:Reflex; do
            sym="${f%%:*}"
            name="${f##*:}"
            if grep -q "^CONFIG_${sym}=y" "$O/.config" 2>/dev/null; then
              FEATURES="${FEATURES}${name}, "
            fi
          done
          FEATURES="${FEATURES%, }"
            # Cambyses has no CONFIG_ symbol - it is a SCHED_FEAT that is always
            # compiled in, so detect it from the source the build actually used.
            # The CONFIG_-driven loop above reads out/.config, which does not
            # exist yet at this point (Configure defconfig runs later), so only
            # this source-based entry can be reported from here.
            if grep -q 'SCHED_FEAT(LB_STRICT_BUDGET' kernel/sched/features.h; then
              if [ -n "$FEATURES" ]; then FEATURES="$FEATURES, Cambyses"; else FEATURES="Cambyses"; fi
            fi
            echo "${BUILD_TS} -- Kernel features: ${FEATURES:-none}"

      - name: Fetch toolchains (primary + fallback mirrors)
        run: |
          set -eo pipefail
          mkdir -p tc
          fetch() { # fetch <dest.tar.gz> <url>...
            dest="$1"; shift
            for url in "$@"; do
              echo ":: group::fetch $url"
              if curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 -o "$dest.part" "$url" \
                && [ "$(stat -c%s "$dest.part" 2>/dev/null || echo 0)" -ge 1048576 ] \
                && [ "$(head -c 2 "$dest.part" | od -An -tx1 | tr -d ' \n')" = "1f8b" ] \
                && tar -tzf "$dest.part" >/dev/null 2>&1; then
                mv "$dest.part" "$dest"
                echo "fetched $(basename "$dest")"
                echo ":: endgroup::"
                return 0
              fi
              echo ":: warning::mirror failed: $url"
              rm -f "$dest.part"
              echo ":: endgroup::"
            done
            echo ":: error::every mirror failed for $dest"
            return 1
          }
          stage() { # stage <tarball> <dest-prefix> <binary-name>
            tarball="$1"; dest="$2"; binname="$3"
            tmp="$(mktemp -d)"
            tar -xf "$tarball" -C "$tmp"
            found="$(find "$tmp" \( -type f -o -type l \) -name "$binname" -print -quit)"
            if [ -z "$found" ]; then
              echo ":: error::$binname not found inside $tarball"
              return 1
            fi
            prefix="$(dirname "$(dirname "$found")")"
            rm -rf "$dest"
            mkdir -p "$(dirname "$dest")"
            mv "$prefix" "$dest"
            chmod -R a+rx "$dest/bin" 2>/dev/null || true
            rm -rf "$tmp"
          }
          # Clang 12 (AOSP r416183b via the LineageOS mirror) - fall back to AOSP master, then ZyC Clang 14
          fetch tc/clang.tar.gz \
            "https://api.github.com/repos/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/tarball" \
            "https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b/archive/refs/heads/lineage-20.0.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/master.tar.gz" \
            "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20261022-release/Clang-14.0.6-20261022.tar.gz"
          stage tc/clang.tar.gz tc/clang clang
          # AOSP GCC 4.9 aarch64 binutils - LineageOS GitHub mirrors as fallback
          fetch tc/gcc64.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/android12L-release.tar.gz" \
            "https://api.github.com/repos/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/tarball" \
            "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9/archive/refs/heads/lineage-19.1.tar.gz"
          stage tc/gcc64.tar.gz tc/gcc-64 aarch64-linux-android-ld
          # AOSP GCC 4.9 arm binutils - LineageOS GitHub mirrors as fallback
          fetch tc/gcc32.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/android12L-release.tar.gz" \
            "https://api.github.com/repos/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/tarball" \
            "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9/archive/refs/heads/lineage-19.1.tar.gz"
          stage tc/gcc32.tar.gz tc/gcc-32 arm-linux-androideabi-ld

      - name: Export toolchain PATH
        run: |
          set -eo pipefail
          echo "$PWD/tc/clang/bin" >> "$GITHUB_PATH"
          echo "$PWD/tc/gcc-64/bin" >> "$GITHUB_PATH"
          echo "$PWD/tc/gcc-32/bin" >> "$GITHUB_PATH"
          echo "$HOME/. local/bin" >> "$GITHUB_PATH"

      - name: Assert toolchain binaries
        run: |
          set -eo pipefail
          for b in tc/clang/bin/clang \
            tc/gcc-64/bin/aarch64-linux-android-ld tc/gcc-64/bin/aarch64-linux-android-as tc/gcc-64/bin/aarch64-linux-android-nm \
            tc/gcc-32/bin/arm-linux-androideabi-ld tc/gcc-32/bin/arm-linux-androideabi-as tc/gcc-32/bin/arm-linux-androideabi-nm; do
            if [ ! -x "$b" ]; then
              echo ":: error::missing or non-executable toolchain binary: $b"
              exit 1
            fi
          done
          tc/clang/bin/clang --version | head -n 2
          tc/gcc-64/bin/aarch64-linux-android-ld --version | head -n 1
          tc/gcc-32/bin/arm-linux-androideabi-ld --version | head -n 1

      # CC must be passed on every make command line: the top Makefile assigns CC with "=",
      # so exporting CC from the environment is silently overridden.
      - name: Configure defconfig
        run: |
          set -eo pipefail
          export ARCH=arm64 SUBARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC="$PWD/tc/clang/bin/clang" \
            CROSS_COMPILE="$PWD/tc/gcc-64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/tc/gcc-32/bin/arm-linux-androideabi-" \
            tissot_defconfig

      - name: Resolve boot image artifact
        id: img
        run: |
          set -eo pipefail
          # CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y -> the DTB-carrying image is Image.gz-dtb
          if grep -q '^CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y' out/.config; then
            IMAGE="$(sed -n 's/^CONFIG_BUILD_ARM64_APPENDED_KERNEL_IMAGE_NAME="\(.*\)"$/\1/p' out/.config)"
            if [ -z "$IMAGE" ]; then IMAGE="Image.gz-dtb"; fi
          else
            IMAGE="$(sed -n 's/^CONFIG_ARM64_DEFAULT_IMAGE_NAME="\(.*\)"$/\1/p' out/.config)"
            if [ -z "$IMAGE" ]; then IMAGE="Image"; fi
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "boot image artifact: $IMAGE"

      - name: Build DTBs
        run: |
          set -eo pipefail
          export ARCH=arm64 SUBARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC="$PWD/tc/clang/bin/clang" \
            CROSS_COMPILE="$PWD/tc/gcc-64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/tc/gcc-32/bin/arm-linux-androideabi-" \
            -j"$(nproc)" dtbs

      # arch/arm64/boot/Makefile expands DTB_OBJS with $(shell find) while parsing, so a single
      # make invocation cannot see every DTB produced in the same run - hence two passes.
      - name: Build boot image (pass 1 of 2)
        env:
          IMAGE_NAME: ${{ steps. img. outputs. image }}
        run: |
          set -eo pipefail
          export ARCH=arm64 SUBARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC="$PWD/tc/clang/bin/clang" \
            CROSS_COMPILE="$PWD/tc/gcc-64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/tc/gcc-32/bin/arm-linux-androideabi-" \
            -j"$(nproc)" "$IMAGE_NAME"

      - name: Build boot image (pass 2 of 2)
        env:
          IMAGE_NAME: ${{ steps. img. outputs. image }}
        run: |
          set -eo pipefail
          export ARCH=arm64 SUBARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu-
          make O=out CC="$PWD/tc/clang/bin/clang" \
            CROSS_COMPILE="$PWD/tc/gcc-64/bin/aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="$PWD/tc/gcc-32/bin/arm-linux-androideabi-" \
            -j"$(nproc)" "$IMAGE_NAME"

      - name: KSU / SUSFS symbol gate (warn-only)
        run: |
          set -eo pipefail
          if grep -q '^CONFIG_KSU=y' out/.config; then
            echo ":: notice::CONFIG_KSU=y present"
          else
            echo ":: warning::CONFIG_KSU is not set yet (BakaSU submodule may still be merging) - not failing the build"
          fi
          if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo ":: notice::CONFIG_KSU_SUSFS=y present"
          else
            echo ":: warning::CONFIG_KSU_SUSFS is not set yet - not failing the build"
          fi

      - name: Package AnyKernel3 zip
        id: pkg
        env:
          IMAGE_NAME: ${{ steps.img.outputs.image }}
          KERNEL_STRING: ${{ steps.meta.outputs.kernel_string }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          BUILD_TS: ${{ steps.meta.outputs.build_ts }}
        run: |
          set -eo pipefail
          if [ ! -f "out/arch/arm64/boot/$IMAGE_NAME" ]; then
            echo ":: error::out/arch/arm64/boot/$IMAGE_NAME was not produced"
            exit 1
          fi
          # install the tissot AnyKernel3 script over the submodule's stock one
          cp ci/anykernel-tissot.sh anykernel/anykernel.sh
          # Real build timestamp, injected so the AnyKernel banner never has to
          # guess. Without this the property stays empty and the script falls
          # back to the mtime of anykernel.sh inside the zip, which is whatever
          # the recovery/filesystem happens to report (users saw "2020").
          sed -i "s#^kernel\. build_date=.*#kernel. build_date=${BUILD_TS}#" anykernel/anykernel.sh
          if ! grep -qxF "kernel. build_date=${BUILD_TS}" anykernel/anykernel.sh; then
            echo ":: error::kernel. build_date injection failed"
            exit 1
          fi
          # kernel. string is derived from real sources (kernel + BakaSU submodule), never hardcoded
          sed -i "s#^kernel. string=.*#kernel. string=${KERNEL_STRING}#" anykernel/anykernel.sh
          if ! grep -qxF "kernel. string=${KERNEL_STRING}" anykernel/anykernel.sh; then
            echo ":: error::kernel. string injection failed"
            exit 1
          fi
          # AK3 shadow guard: drop VCS metadata and every other kernel image name AK3's
          # fixed-order flash loop could pick INSTEAD of the DTB-carrying one (a bare Image
          # shadows Image.gz-dtb -> DTBLESS boot -> black screen).
          rm -rf anykernel/.git anykernel/.github \
            Image Image-dtb Image.gz Image.bz2 Image.lzo Image.lzma Image.xz Image.lz4 kernel
          cp "out/arch/arm64/boot/$IMAGE_NAME" anykernel/
          ZIP="tissot-BakaSU-SUSFS-${BUILD_DATE}-${GITHUB_SHA:0:8}.zip"
          ( cd anykernel && zip -r9 "../$ZIP" . -x '.git*' > /dev/null )
          if ! unzip -l "$ZIP" | grep -qE " ${IMAGE_NAME}$"; then
            echo ":: error::$IMAGE_NAME is not inside $ZIP"
            exit 1
          fi
          if unzip -l "$ZIP" | grep -qE " Image$"; then
            echo ":: error::a bare Image is inside $ZIP and would shadow $IMAGE_NAME"
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          unzip -l "$ZIP" | tail -n 3

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: tissot-anykernel
          path: "*.zip" # never out/ - it holds a multi-GB vmlinux
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    needs: build
    runs-on: ubuntu-24.04
    env:
      # anchored to the build moment so tag / zip / release body can never disagree
      BUILD_DATE: ${{ needs.build.outputs.build_date }}
      BUILD_TS: ${{ needs.build.outputs.build_ts }}
    steps:
      - name: Checkout for release metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve release metadata
        id: rel
        run: |
          set -eo pipefail
          SHA8="${GITHUB_SHA:0:8}"
          AK3_SHA="$(git ls-tree HEAD anykernel | awk '{print $3}')"
          KSU_SHA="$(git ls-tree HEAD drivers/KernelSU | awk '{print $3}')"
          if [ -z "$KSU_SHA" ]; then KSU_SHA="not-merged-yet"; fi
          TAG="tissot-${BUILD_DATE}-${SHA8}"
          {
            echo "tag=$TAG"
            echo "ak3_sha=$AK3_SHA"
            echo "ksu_sha=$KSU_SHA"
            echo "sha8=$SHA8"
            echo "build_ts=$BUILD_TS"
          } >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG"
          echo "built at (UTC): $BUILD_TS"

      - name: Download zip artifact
        uses: actions/download-artifact@v4
        with:
          name: tissot-anykernel
          path: artifacts

      - name: Assert zip count
        run: |
          set -eo pipefail
          n="$(find artifacts -maxdepth 1 -type f -name '*.zip' | wc -l)"
          echo "zip count: $n"
          if [ "$n" -ne 1 ]; then
            echo ":: error::expected exactly 1 zip, found $n"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: tissot BakaSU+SUSFS ${{ steps.rel.outputs.sha8 }} (BakaSU ${{ needs.build.outputs.bakasu_ver_name }})
          make_latest: true
          files: artifacts/*.zip
          body: |
            ## tissot (Xiaomi Mi A1) — BakaSU + SUSFS

            | | |
            |---|---|
            | Kernel | Linux ${{ needs.build.outputs.kver }} (stable, EOL) |
            | Tree | LineageOS/CAF msm8953 (lineage-21) |
            | Root | BakaSU (KernelSU fork, main) @ ${{ needs.build.outputs.ksu_sha }} (${{ needs.build.outputs.bakasu_ver_name }}) |
            | BakaSU version code | ${{ needs.build.outputs.bakasu_ver_code }} |
            | BakaSU version name | ${{ needs.build.outputs.bakasu_ver_name }} |
            | Supported Managers | ${{ needs.build.outputs.bakasu_managers }} |
            | SUSFS | inline hooks, susfs-compatible |
            | Features | BORE scheduler, MGLRU page reclaim, NTSYNC (Wine/Proton), ADIOS I/O scheduler, BBRv3 congestion, NoMount, Baseband-guard LSM, Rekernel net monitor, DroidSpaces container, POC-selector (idle CPU, on), Reflex cpufreq governor (on, default gov) |
            | Boot image | `${{ needs.build.outputs.image }}` (DTB appended) |
            | Scheduler | Cambyses CFS balancer (LB_STRICT_BUDGET), BORE, POC-selector |
            | Flasher | AnyKernel3 @ ${{ steps.rel.outputs.ak3_sha }} |
            | Commit | ${{ steps.rel.outputs.sha8 }} |
            | Build date (UTC) | ${{ needs.build.outputs.build_ts }} |

            **Flash:** TWRP/OrangeFox or any kernel-flasher app → install the zip. Mi A1 is A-only, so there is no second slot to switch to.

            Built by [this CI run](${{ github. server_url }}/${{ github. repository }}/actions/runs/${{ github. run_id }}).
